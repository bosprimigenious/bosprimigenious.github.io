---
layout: default
---
<div class="fx">
  <article class="fx-note">
    <header class="note-head">
      <p class="fx-kicker">
        <a href="{{ '/projects/' | relative_url }}">Work</a>
        {% if page.category %}· {{ page.category }}{% endif %}
      </p>
      <h1>{{ page.title }}</h1>
      {% if page.description %}
      <p class="note-deck">{{ page.description }}</p>
      {% endif %}
    </header>

    <div class="note-body">
      {{ content }}
    </div>

    <p style="margin-top: 36px;">
      <a class="fx-btn" href="{{ '/projects/' | relative_url }}">← Work</a>
    </p>
  </article>
</div>
